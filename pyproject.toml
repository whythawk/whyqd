[project]
name = "whyqd"
dynamic = ["version"]
description = "data wrangling simplicity, complete audit transparency, and at speed"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gavin Chait", email = "gchait@whythawk.com" }]
keywords = ["python", "data-science", "pandas", "open-data", "open-science", "data-analysis", "data-wrangling", "data-management", "munging", "crosswalks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.4.6,<3",
    "openpyxl>=3.1.5,<4",
    "packaging>=26.3,<27",
    "pandas>=3.0.6,<4",
    "polars>=2.0.0,<3",
    "pyarrow>=24,<27",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "randomname>=0.2.1,<0.3",
    "rfc8785>=0.1.4,<0.2",
    "xlrd>=2.0.2,<3",
]

[project.optional-dependencies]
verify-1x = [
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.6,<4",
    "pyarrow>=24,<27",
    "xlrd>=2.0.2,<3",
]

[project.urls]
Homepage = "https://whyqd.com"
Repository = "https://github.com/whythawk/whyqd/"
Documentation = "https://whyqd.readthedocs.io/"

[dependency-groups]
dev = [
    "ruff~=0.14.0",
    "pytest>=7.2.2",
    "jsonschema>=4.26",
]
notebooks = [
    "jupyterlab>=3.6.1",
]
docs = [
    "markdown>=3.5.2",
    "mkdocs>=1.5.3",
    "pymdown-extensions>=10.7.1",
    "paginate>=0.5.6",
    "mkdocs-exclude>=1.0.2",
    "mkdocstrings-python>=1.8.0",
    "mkdocs-redirects>=1.2.1",
    "mkdocs-material>=9.5.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "whyqd/VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["whyqd"]

[tool.hatch.build.targets.sdist]
include = ["/whyqd", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
