[project]
name = "whyqd"
dynamic = ["version"]
description = "data wrangling simplicity, complete audit transparency, and at speed"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gavin Chait", email = "gchait@whythawk.com" }]
keywords = ["python", "data-science", "pandas", "open-data", "open-science", "data-analysis", "data-wrangling", "data-management", "munging", "crosswalks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21.1",
    "openpyxl>=3.0.7",
    "pandas>=1.5.2",
    "xlrd>=2.0.1",
    "pydantic>=1.8.2",
    "tabulate>=0.8.9",
    "ray>=2.2.0",
    "modin>=0.25.1",
    "randomname>=0.2.1",
    "pyarrow>=11.0.0",
    "setuptools>=67.7.2",
    "python-dotenv>=1.0.0",
    "grpcio>=1.59.3",
    "pydantic-settings>=2.8.1,<3",
]

[project.urls]
Homepage = "https://whyqd.com"
Repository = "https://github.com/whythawk/whyqd/"
Documentation = "https://whyqd.readthedocs.io/"

[dependency-groups]
dev = [
    "ruff~=0.14.0",
    "pytest>=7.2.2",
    "jupyterlab>=3.6.1",
]
docs = [
    "markdown>=3.5.2",
    "mkdocs>=1.5.3",
    "pymdown-extensions>=10.7.1",
    "paginate>=0.5.6",
    "mkdocs-exclude>=1.0.2",
    "mkdocstrings-python>=1.8.0",
    "mkdocs-redirects>=1.2.1",
    "mkdocs-material>=9.5.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "whyqd/VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["whyqd"]

[tool.hatch.build.targets.sdist]
include = ["/whyqd", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
